openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: mine, schema: { type: boolean } }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
    post:
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
  /campaigns/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCampaign
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
    patch:
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
    delete:
      operationId: deleteCampaign
      responses:
        '204': { description: Deleted }
  /applications:
    get:
      operationId: listApplications
      parameters:
        - { in: query, name: role, schema: { type: string, enum: [tester, founder] } }
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
    post:
      operationId: applyCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
  /applications/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reviewApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
  /submissions:
    get:
      operationId: listSubmissions
      parameters:
        - { in: query, name: role, schema: { type: string, enum: [tester, founder] } }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Submission' } }
    post:
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /submissions/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reviewSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /rewards:
    get:
      operationId: listRewards
      responses:
        '200':
          description: Vault
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reward' } }
  /rewards/{id}/claim:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: claimReward
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Personal metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /profile:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
  /activity:
    get:
      operationId: getActivity
      responses:
        '200':
          description: Public anonymized event feed
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Activity' } }
  /stats:
    get:
      operationId: getStats
      responses:
        '200':
          description: Public counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Campaign:
      type: object
      required: [id, title, company, description, category, tags, reward, method, slots, filledSlots, status, createdAt, instructions, productUrl, screeningQuestions, minTrust, autoApprove, featured, demo, ownerId]
      properties:
        id: { type: integer }
        title: { type: string }
        company: { type: string }
        description: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        reward: { type: string }
        method: { type: string, enum: [secret_code, email_match, media, webhook] }
        slots: { type: integer }
        filledSlots: { type: integer }
        status: { type: string, enum: [active, paused, completed] }
        createdAt: { type: string }
        instructions: { type: string }
        productUrl: { type: string }
        screeningQuestions: { type: array, items: { type: string } }
        minTrust: { type: integer }
        autoApprove: { type: boolean }
        featured: { type: boolean }
        demo: { type: boolean }
        ownerId: { type: string }
    CampaignInput:
      type: object
      required: [title, company, description, category, tags, reward, method, slots, instructions, productUrl, screeningQuestions, minTrust, autoApprove, rewardCodes]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        company: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        category: { type: string, enum: [DevTools, AI / ML, Web3, FinTech, Mobile] }
        tags: { type: array, maxItems: 8, items: { type: string, maxLength: 30 } }
        reward: { type: string, minLength: 3, maxLength: 150 }
        method: { type: string, enum: [secret_code, email_match, media] }
        slots: { type: integer, minimum: 1, maximum: 15 }
        instructions: { type: string, minLength: 10, maxLength: 10000 }
        productUrl: { type: string, format: uri }
        screeningQuestions: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 3, maxLength: 250 } }
        minTrust: { type: integer, minimum: 0, maximum: 100 }
        autoApprove: { type: boolean }
        secretCode: { type: string, maxLength: 120 }
        rewardCodes: { type: array, minItems: 1, maxItems: 15, items: { type: string, minLength: 1, maxLength: 500 } }
    CampaignUpdate:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        instructions: { type: string, minLength: 10, maxLength: 10000 }
        status: { type: string, enum: [active, paused, completed] }
    ApplicationInput:
      type: object
      required: [campaignId, answers]
      properties:
        campaignId: { type: integer }
        answers: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 2, maxLength: 2000 } }
    Application:
      type: object
      required: [id, campaignId, campaignTitle, userId, username, answers, status, createdAt, deadline, productUrl, method, reward]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        campaignTitle: { type: string }
        userId: { type: string }
        username: { type: string }
        answers: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, approved, rejected, submitted, completed, expired] }
        createdAt: { type: string }
        deadline: { type: [string, 'null'] }
        productUrl: { type: string }
        method: { type: string }
        reward: { type: string }
    ReviewInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, maxLength: 2000 }
    SubmissionInput:
      type: object
      required: [applicationId, title, content]
      properties:
        applicationId: { type: integer }
        title: { type: string, minLength: 3, maxLength: 200 }
        content: { type: string, minLength: 20, maxLength: 20000 }
        mediaUrl: { type: string }
        accountEmail: { type: string }
        secretCode: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
    Submission:
      type: object
      required: [id, applicationId, campaignTitle, username, title, content, mediaUrl, accountEmail, severity, status, reason, createdAt, reviewDeadline]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        campaignTitle: { type: string }
        username: { type: string }
        title: { type: string }
        content: { type: string }
        mediaUrl: { type: string }
        accountEmail: { type: string }
        severity: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        createdAt: { type: string }
        reviewDeadline: { type: string }
    Reward:
      type: object
      required: [id, campaignTitle, title, code, claimed, createdAt]
      properties:
        id: { type: integer }
        campaignTitle: { type: string }
        title: { type: string }
        code: { type: [string, 'null'] }
        claimed: { type: boolean }
        createdAt: { type: string }
    ProfileInput:
      type: object
      required: [username, bio, stack, os]
      properties:
        username: { type: string, minLength: 3, maxLength: 40, pattern: '^[a-zA-Z0-9_-]+$' }
        bio: { type: string, maxLength: 1000 }
        stack: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        os: { type: string, maxLength: 80 }
    Profile:
      type: object
      required: [id, username, bio, stack, os, trustScore, xp, streak, freezes, badges, contributions]
      properties:
        id: { type: string }
        username: { type: string }
        bio: { type: string }
        stack: { type: array, items: { type: string } }
        os: { type: string }
        trustScore: { type: integer }
        xp: { type: integer }
        streak: { type: integer }
        freezes: { type: integer }
        badges: { type: array, items: { type: string } }
        contributions: { type: array, items: { $ref: '#/components/schemas/Contribution' } }
    Contribution:
      type: object
      required: [date, count]
      properties:
        date: { type: string }
        count: { type: integer }
    Dashboard:
      type: object
      required: [activeTests, pendingApplications, completedTests, rewards, campaigns, pendingReviews, totalApplications, profile]
      properties:
        activeTests: { type: integer }
        pendingApplications: { type: integer }
        completedTests: { type: integer }
        rewards: { type: integer }
        campaigns: { type: integer }
        pendingReviews: { type: integer }
        totalApplications: { type: integer }
        profile: { $ref: '#/components/schemas/Profile' }
    Activity:
      type: object
      required: [id, event, detail, createdAt]
      properties:
        id: { type: integer }
        event: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    Stats:
      type: object
      required: [campaigns, testers, verifiedReports, availableSlots]
      properties:
        campaigns: { type: integer }
        testers: { type: integer }
        verifiedReports: { type: integer }
        availableSlots: { type: integer }
