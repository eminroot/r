openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: mine, schema: { type: boolean } }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
    post:
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
  /campaigns/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCampaign
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
    patch:
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
    delete:
      operationId: deleteCampaign
      responses:
        '204': { description: Deleted }
  /applications:
    get:
      operationId: listApplications
      parameters:
        - { in: query, name: role, schema: { type: string, enum: [tester, founder] } }
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
    post:
      operationId: applyCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
  /applications/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reviewApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
  /submissions:
    get:
      operationId: listSubmissions
      parameters:
        - { in: query, name: role, schema: { type: string, enum: [tester, founder] } }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Submission' } }
    post:
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /submissions/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reviewSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
  /rewards:
    get:
      operationId: listRewards
      responses:
        '200':
          description: Vault
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reward' } }
  /rewards/{id}/claim:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: claimReward
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Personal metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /profile:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
  /activity:
    get:
      operationId: getActivity
      responses:
        '200':
          description: Public anonymized event feed
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Activity' } }
  /stats:
    get:
      operationId: getStats
      responses:
        '200':
          description: Public counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
  /profiles/{username}:
    parameters:
      - { in: path, name: username, required: true, schema: { type: string } }
    get:
      operationId: getPublicProfile
      responses:
        '200':
          description: Public tester profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
  /integrations:
    get:
      operationId: getIntegrations
      responses:
        '200':
          description: Founder integration settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
    put:
      operationId: updateIntegrations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationsInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
  /integrations/webhook/test:
    post:
      operationId: testWebhook
      responses:
        '200':
          description: Test delivery result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
  /integrations/webhook/rotate:
    post:
      operationId: rotateWebhookSecret
      responses:
        '200':
          description: New signing secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
  /api-keys:
    get:
      operationId: listApiKeys
      responses:
        '200':
          description: Keys (without secrets)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
    post:
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyInput' }
      responses:
        '201':
          description: Created. The token is shown once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
  /api-keys/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    delete:
      operationId: revokeApiKey
      responses:
        '204': { description: Revoked }
  /v1/verifications:
    post:
      operationId: createVerification
      description: Called by a founder's backend with an API key (Authorization Bearer) when a tester finishes the target action.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationInput' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Campaign:
      type: object
      required: [id, title, company, description, category, tags, reward, rewardValue, method, slots, filledSlots, status, createdAt, instructions, productUrl, screeningQuestions, minTrust, autoApprove, autoApproveTrust, featured, demo, ownerId]
      properties:
        id: { type: integer }
        title: { type: string }
        company: { type: string }
        logoUrl: { type: string }
        description: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        reward: { type: string }
        rewardValue: { type: integer }
        method: { type: string, enum: [secret_code, email_match, media, webhook] }
        slots: { type: integer }
        filledSlots: { type: integer }
        status: { type: string, enum: [active, paused, completed] }
        createdAt: { type: string }
        instructions: { type: string }
        productUrl: { type: string }
        screeningQuestions: { type: array, items: { type: string } }
        minTrust: { type: integer }
        autoApprove: { type: boolean }
        autoApproveTrust: { type: integer }
        featured: { type: boolean }
        demo: { type: boolean }
        ownerId: { type: string }
    CampaignInput:
      type: object
      required: [title, company, description, category, tags, reward, method, slots, instructions, productUrl, screeningQuestions, minTrust, autoApprove, rewardCodes]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        company: { type: string, minLength: 2, maxLength: 80 }
        logoUrl: { type: string, maxLength: 2048 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        category: { type: string, enum: [DevTools, AI / ML, Web3, FinTech, Mobile] }
        tags: { type: array, maxItems: 8, items: { type: string, maxLength: 30 } }
        reward: { type: string, minLength: 3, maxLength: 150 }
        rewardValue: { type: integer, minimum: 0, maximum: 100000 }
        method: { type: string, enum: [secret_code, email_match, media, webhook] }
        slots: { type: integer, minimum: 1, maximum: 15 }
        instructions: { type: string, minLength: 10, maxLength: 10000 }
        productUrl: { type: string, format: uri }
        screeningQuestions: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 3, maxLength: 250 } }
        minTrust: { type: integer, minimum: 0, maximum: 100 }
        autoApprove: { type: boolean }
        autoApproveTrust: { type: integer, minimum: 0, maximum: 100 }
        secretCode: { type: string, maxLength: 120 }
        rewardCodes: { type: array, minItems: 1, maxItems: 15, items: { type: string, minLength: 1, maxLength: 500 } }
    CampaignUpdate:
      type: object
      properties:
        logoUrl: { type: string, maxLength: 2048 }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        instructions: { type: string, minLength: 10, maxLength: 10000 }
        status: { type: string, enum: [active, paused, completed] }
    ApplicationInput:
      type: object
      required: [campaignId, answers]
      properties:
        campaignId: { type: integer }
        answers: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 2, maxLength: 2000 } }
    Application:
      type: object
      required: [id, campaignId, campaignTitle, userId, username, trustScore, answers, status, createdAt, deadline, verifiedAt, productUrl, method, reward]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        campaignTitle: { type: string }
        userId: { type: string }
        username: { type: string }
        trustScore: { type: integer }
        answers: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, approved, rejected, submitted, completed, expired] }
        createdAt: { type: string }
        deadline: { type: [string, 'null'] }
        verifiedAt: { type: [string, 'null'] }
        productUrl: { type: string }
        method: { type: string }
        reward: { type: string }
    ReviewInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        reason: { type: string, maxLength: 2000 }
    SubmissionInput:
      type: object
      required: [applicationId, title, content]
      properties:
        applicationId: { type: integer }
        title: { type: string, minLength: 3, maxLength: 200 }
        content: { type: string, minLength: 20, maxLength: 20000 }
        mediaUrl: { type: string }
        accountEmail: { type: string }
        secretCode: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
    Submission:
      type: object
      required: [id, applicationId, campaignId, campaignTitle, username, title, content, mediaUrl, accountEmail, severity, status, reason, createdAt, reviewDeadline]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        campaignId: { type: integer }
        campaignTitle: { type: string }
        username: { type: string }
        title: { type: string }
        content: { type: string }
        mediaUrl: { type: string }
        accountEmail: { type: string }
        severity: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        createdAt: { type: string }
        reviewDeadline: { type: string }
    Reward:
      type: object
      required: [id, campaignTitle, title, code, claimed, createdAt]
      properties:
        id: { type: integer }
        campaignTitle: { type: string }
        title: { type: string }
        code: { type: [string, 'null'] }
        claimed: { type: boolean }
        createdAt: { type: string }
    ProfileInput:
      type: object
      required: [username, bio, stack, os]
      properties:
        username: { type: string, minLength: 3, maxLength: 40, pattern: '^[a-zA-Z0-9_-]+$' }
        bio: { type: string, maxLength: 1000 }
        stack: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        os: { type: string, maxLength: 80 }
    Profile:
      type: object
      required: [id, username, bio, stack, os, trustScore, xp, streak, maxStreak, freezes, badges, approvedReports, videoReports, contributions, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        bio: { type: string }
        stack: { type: array, items: { type: string } }
        os: { type: string }
        trustScore: { type: integer }
        xp: { type: integer }
        streak: { type: integer }
        maxStreak: { type: integer }
        freezes: { type: integer }
        badges: { type: array, items: { type: string } }
        approvedReports: { type: integer }
        videoReports: { type: integer }
        contributions: { type: array, items: { $ref: '#/components/schemas/Contribution' } }
        createdAt: { type: [string, 'null'] }
    PublicProfile:
      type: object
      required: [username, bio, stack, os, trustScore, xp, streak, maxStreak, freezes, badges, approvedReports, videoReports, contributions, createdAt]
      properties:
        username: { type: string }
        bio: { type: string }
        stack: { type: array, items: { type: string } }
        os: { type: string }
        trustScore: { type: integer }
        xp: { type: integer }
        streak: { type: integer }
        maxStreak: { type: integer }
        freezes: { type: integer }
        badges: { type: array, items: { type: string } }
        approvedReports: { type: integer }
        videoReports: { type: integer }
        contributions: { type: array, items: { $ref: '#/components/schemas/Contribution' } }
        createdAt: { type: [string, 'null'] }
    Contribution:
      type: object
      required: [date, count]
      properties:
        date: { type: string }
        count: { type: integer }
    Dashboard:
      type: object
      required: [activeTests, pendingApplications, completedTests, rewards, campaigns, pendingReviews, totalApplications, profile]
      properties:
        activeTests: { type: integer }
        pendingApplications: { type: integer }
        completedTests: { type: integer }
        rewards: { type: integer }
        campaigns: { type: integer }
        pendingReviews: { type: integer }
        totalApplications: { type: integer }
        profile: { $ref: '#/components/schemas/Profile' }
    Activity:
      type: object
      required: [id, event, detail, createdAt]
      properties:
        id: { type: integer }
        event: { type: string }
        detail: { type: string }
        createdAt: { type: string }
    Stats:
      type: object
      required: [campaigns, testers, verifiedReports, availableSlots]
      properties:
        campaigns: { type: integer }
        testers: { type: integer }
        verifiedReports: { type: integer }
        availableSlots: { type: integer }
    Integrations:
      type: object
      required: [webhookUrl, webhookSecret, githubRepo, lastDeliveryAt, lastDeliveryStatus, lastDeliveryEvent]
      properties:
        webhookUrl: { type: string }
        webhookSecret: { type: string }
        githubRepo: { type: string }
        lastDeliveryAt: { type: [string, 'null'] }
        lastDeliveryStatus: { type: [integer, 'null'] }
        lastDeliveryEvent: { type: [string, 'null'] }
    IntegrationsInput:
      type: object
      required: [webhookUrl, githubRepo]
      properties:
        webhookUrl: { type: string, maxLength: 2048 }
        githubRepo: { type: string, maxLength: 140 }
    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, lastUsedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: [string, 'null'] }
    ApiKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
    ApiKeyCreated:
      type: object
      required: [id, name, prefix, createdAt, lastUsedAt, token]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: [string, 'null'] }
        token: { type: string }
    VerificationInput:
      type: object
      required: [campaignId, betadropId]
      properties:
        campaignId: { type: integer }
        betadropId: { type: string, minLength: 1, maxLength: 200 }
    Verification:
      type: object
      required: [applicationId, status, verifiedAt]
      properties:
        applicationId: { type: integer }
        status: { type: string }
        verifiedAt: { type: string }
